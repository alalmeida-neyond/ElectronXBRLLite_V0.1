spring.application.name=demo
server.port=8082
management.endpoints.web.exposure.include=health
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.xhtml
spring.thymeleaf.mode=HTML
spring.datasource.url=jdbc:sqlite:UNMANAGEDPROCESS.db?foreign_keys=on
#spring.datasource.url=jdbc:sqlite:UNMANAGEDPROCESS.db?foreign_keys=off
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=never
# spring.jpa.properties.hibernate.hbm2ddl.auto=update

spring.jpa.hibernate.ddl-auto=none
#spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false


spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=true

# Hibernate Configuration
spring.jpa.properties.hibernate.format_sql=true

# Debug logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Disable JDBC metadata operations that cause SQLite issues
spring.jpa.properties.hibernate.id.new_generator_mappings=false

# Connection pool settings to better handle connection closure
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=30000
spring.datasource.hikari.connection-timeout=20000

# Add for SQLite to improve connection handling
spring.datasource.hikari.leak-detection-threshold=30000

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

management.metrics.enable.jvm=false
# or to be explicit:
spring.autoconfigure.exclude=org.springframework.boot.actuate.autoconfigure.metrics.JvmMetricsAutoConfiguration

