spring.application.name=demo
server.port=8082
management.endpoints.web.exposure.include=health
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.xhtml
spring.thymeleaf.mode=HTML

spring.datasource.url=jdbc:oracle:thin:@ptlisdev02.epimetheus.pt:1521:PTLISDEV02
spring.datasource.username=DPM_CD
spring.datasource.password=DPM2CD
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


spring.sql.init.mode=never

spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=true

spring.datasource.hikari.maxLifetime=0
spring.datasource.hikari.idleTimeout=0
spring.datasource.hikari.keepaliveTime=0

logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF

logging.level.org.springframework.jdbc.core=OFF
logging.level.org.springframework.jdbc.core.JdbcTemplate=OFF
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=OFF

logging.level.net.ttddyy.dsproxy=OFF
logging.level.p6spy=OFF

logging.level.com.zaxxer.hikari=INFO

spring.jpa.properties.hibernate.id.new_generator_mappings=false

spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=30000

spring.datasource.hikari.leak-detection-threshold=30000

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

management.metrics.enable.jvm=false

spring.autoconfigure.exclude=org.springframework.boot.actuate.autoconfigure.metrics.JvmMetricsAutoConfiguration

