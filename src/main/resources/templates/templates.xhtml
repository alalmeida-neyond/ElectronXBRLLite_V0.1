<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org/">

<head>
  <div th:replace="~{Layouts/title}"></div>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="./Style/mainPageUpload.css" rel="stylesheet" type="text/css" />
  <link rel="shortcut icon" th:href="@{/Images/favico.ico}" />
  <link href="./Style/Headers.css" rel="stylesheet" type="text/css" />
  <link href="./Style/footer.css" rel="stylesheet" type="text/css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="./Scripts/templatesPage.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"></script>

</head>

<body class="templatesBody" style="padding-top:40px;">
  <div id="mainHeader">
    <div th:replace="~{Layouts/xbrl2_header1}"></div>
  </div>

  <div class="container">
    <div id="upload-success" style="display: none; margin-top: 10px;">
        <span class="internationalization" id="upload-success-text" data-key="successMessageDirectoryTemplate.label" th:attr="data-value-directory=${storedPath}"></span>
        <button type="button" class="btn-close-notification btn ms-auto" id="btn-close-notification">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
    <div class="row mb-3 filterDiv" id="filterDiv">
      <div class="col-md-2">
        <select class="form-select" id="filterModule" th:attr="data-selected=${currentModuleVid}">
          <option value="" class="internationalization" data-key="allModules.label">{{allModules.label}}</option>
        </select>
      </div>
          <div class="col-md-2">
            <div class="d-flex gap-2">
              <select name="filterYear" id="filterYear" class="form-control" th:attr="data-selected=${currentYear}">
                <option value="" class="internationalization" data-key="yearSelect.label" selected>{{yearSelect.label}}</option>
                <option id="behindThreeYears" value=""></option>
                <option id="behindTwoYears" value=""></option>
                <option id="behindOneYear" value=""></option>
                <option id="currentYear" value=""></option>
                <option id="forwardOneYear" value=""></option>
                <option id="forwardTwoYears" value=""></option>
                <option id="forwardThreeYears" value=""></option>
              </select>
              <span></span>
              <select name="filterMonth" id="filterMonth" class="form-control" style="max-width: 70%;" th:attr="data-selected=${currentMonth}">
                <option value="" class="internationalization" data-key="monthSelect.label" selected>{{monthSelect.label}}</option>
                <option value='1' class="internationalization" data-key="januarySelect.label"></option>
                <option value='2' class="internationalization" data-key="februarySelect.label"></option>
                <option value='3' class="internationalization" data-key="marchSelect.label"></option>
                <option value='4' class="internationalization" data-key="aprilSelect.label"></option>
                <option value='5' class="internationalization" data-key="maySelect.label"></option>
                <option value='6' class="internationalization" data-key="juneSelect.label"></option>
                <option value='7' class="internationalization" data-key="julySelect.label"></option>
                <option value='8' class="internationalization" data-key="augustSelect.label"></option>
                <option value='9' class="internationalization" data-key="septemberSelect.label"></option>
                <option value='10' class="internationalization" data-key="octoberSelect.label"></option>
                <option value='11' class="internationalization" data-key="novemberSelect.label"></option>
                <option value='12' class="internationalization" data-key="decemberSelect.label"></option>
              </select>
            </div>
          </div>
          <div class="col-md-2">
            <select class="form-select" id="filterVersion" th:attr="data-selected=${currentVersion}">
              <option value="" class="internationalization" data-key="version.label">{{version.label}}</option>
            </select>
          </div>
      
    </div>
    <div class="table-wrapper-templates" id="table-wrapper-templates">
      <table id="templatesTable" class="table table-bordered templatesTable">
        <thead class="tableHeadValidation thead-light">
          <tr>
            <th class="mainTableHeaderFirst internationalization" data-key="filename.label"></th>
            <th class="mainTableHeader internationalization" data-key="version.label"></th>
            <th class="mainTableHeader internationalization" data-key="fromReferenceDate.label"></th>
            <th class="mainTableHeader internationalization" data-key="toReferenceDate.label"></th>
            <th class="mainTableHeaderLast internationalization" data-key="download.label">Download</th>
          </tr>
        </thead>
        <tbody id="templatesTbody">
          <tr id="noFilteredRows" style="display:none">
            <td colspan="4" class="text-muted internationalization" data-key="noFilesFound.label">
              No files found.
            </td>
          </tr>

          <tr th:each="f : ${templateList}"
              th:attr="data-module-id=${f.moduleVersion.moduleVID},
                      data-filename=${f.filename},
                      data-name=${f.moduleVersion.code},
                      data-version=${f.moduleVersion.versionNumber},
                      data-from=${#temporals.format(f.moduleVersion.fromReferenceDate,'yyyy-MM-dd')},
                      data-to=${(f.moduleVersion.toReferenceDate != null)
                                  ? ((f.moduleVersion.toReferenceDate.toString() == '+999999999-12-31')
                                      ? '+999999999-12-31'
                                      : #temporals.format(f.moduleVersion.toReferenceDate,'yyyy-MM-dd'))
                                  : ''}">
            <td th:text="${f.filename}"></td>
            <td th:text="${f.moduleVersion.versionNumber}"></td>
            <td th:text="${f.moduleVersion.fromReferenceDate}"></td>
            <td th:classappend="${f.moduleVersion.toReferenceDate != null
                                and f.moduleVersion.toReferenceDate.toString() == '+999999999-12-31'}
                                ? ' internationalization' : ''"
                th:attr="data-key=${(f.moduleVersion.toReferenceDate != null
                                    and f.moduleVersion.toReferenceDate.toString() == '+999999999-12-31')
                                    ? 'current.label' : null}"
                th:text="${(f.moduleVersion.toReferenceDate != null
                            and f.moduleVersion.toReferenceDate.toString() != '+999999999-12-31')
                          ? f.moduleVersion.toReferenceDate.toString() : ''}">
            </td>
            <td class="text-center" id="downloadColumn">
              <button type="button"
                      class="btn btn-sm btn-outline-secondary dl-btn"
                      th:attr="data-filename=${(f.filename != null && !#strings.isEmpty(f.filename)) ? f.filename : f.filename}">
                <i class="bi bi-download"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>


  <div id="footer">
    <div th:replace="~{Layouts/footer}"></div>
  </div>

</body>

</html>
