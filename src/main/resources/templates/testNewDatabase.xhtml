<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org/">

<head>
  <div th:replace="~{Layouts/title}"></div>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="./Style/mainPageUpload.css" rel="stylesheet" type="text/css" />
  <link rel="shortcut icon" th:href="@{/Images/favico.ico}" />
  <link href="./Style/Headers.css" rel="stylesheet" type="text/css" />
  <link href="./Style/footer.css" rel="stylesheet" type="text/css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"></script>

</head>

<body>
  <div id="mainHeader">
    <div th:replace="~{Layouts/xbrl2_header1}"></div>
  </div>

  <div class="container">
    <br>
    <h1 th:text="'Entiies (' + ${#arrays.length(items)} + ')'">Entities</h1>

    <p th:if="${items == null or #arrays.length(items) == 0}">Sem Entidades</p>

    <ul th:if="${items != null and #arrays.length(items) > 0}">
        <li th:each="it, stat : ${items}">
            <span th:text="${stat.index + 1}">1</span>.
            <span th:text="${it}">Entidade</span>
        </li>
    </ul>

  </div>

  <div id="footer">
    <div th:replace="~{Layouts/footer}"></div>
  </div>

</body>

</html>
