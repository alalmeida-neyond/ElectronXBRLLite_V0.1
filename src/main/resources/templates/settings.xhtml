<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org/">
  <head>
      <div th:replace="~{Layouts/title}"></div>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
      <link href="./Style/mainPageUpload.css" rel="stylesheet" type="text/css" />
      <link rel="shortcut icon" th:href="@{/Images/favico.ico}" />
      <link href="./Style/Headers.css" rel="stylesheet" type="text/css" />
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
      <script src="./Scripts/updateMetadata.js"></script>
    </head>
  
  <body>
    <div id="header1">
      <div th:replace="~{Layouts/xbrl2_header1}"></div>
    </div>
    <div class="container">
      <div class="alert alert-success" id="alert-success" role="alert" style="display: none;">
        <h4 class="alert-heading internationalization" data-key="updateCompleted1.label">Atualização dos Metadados Concluído!</h4>
        <p class="internationalization" data-key="updateCompleted2.label">Para concluir a atualização dos metadados, por favor, feche a aplicacao e volte a abrir!</p>
      </div>
    </div>
    <div class="container">
      <br><br>
        <form id="metadataForm" enctype="multipart/form-data" onsubmit="downloadMetadata(event)">
          <span>
            <button type="submit" onclick="downloadMetadata(event)" class="btn btn-primary internationalization" data-key="updateMetadata.label" value="{{updateMetadata.label}}" id="uploadButtonMetadata" style="margin: 0 5px; width: auto">Submit</button>
          </span>
        </form>
    </div>

    <div class="container">
        <button class="btn btn-primary internationalization" id="loadingButton" type="button" data-key="loading.label" disabled style="display: none;">
          <span class="spinner-border spinner-border-sm"  role="status" aria-hidden="true"></span>
          Loading...
        </button>
    </div>

    <div class="container">
      
      <input type="file" id="folderInput" webkitdirectory directory multiple style="display: none;" />

      <button type="button" onclick="openFolderSelector()" class="btn btn-primary">
          Select Folder
      </button>

      <div id="directoryDisplay" style="display: none; margin-top: 10px; padding: 10px; background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: 4px;">
      </div>

    </div>

    <div id="footer">
          <div th:replace="~{Layouts/footer}"></div>
    </div>

  </body>

</html>
