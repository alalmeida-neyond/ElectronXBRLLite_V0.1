<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org/">
  <head>
      <div th:replace="~{Layouts/title}"></div>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
      <link href="./Style/mainPageUpload.css" rel="stylesheet" type="text/css" />
      <link rel="shortcut icon" th:href="@{/Images/favico.ico}" />
      <link href="./Style/Headers.css" rel="stylesheet" type="text/css" />
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
      <script src="./Scripts/updateMetadata.js"></script>
    </head>
  
  <body style="padding-top:120px;">
    <div id="mainHeader">
      <div th:replace="~{Layouts/xbrl2_header1}"></div>
    </div>

    <div class="container">
        <button class="btn btn-info internationalization" id="loadingButton" type="button" data-key="loading.label" disabled style="display: none;">
          <span class="spinner-border spinner-border-sm"  role="status" aria-hidden="true"></span>
          Loading...
        </button>
    </div>

    <br>
    <br>

    <div class="container">
      <textarea id="folderPath" rows="4" cols="60" readonly th:text="${storedPath}"></textarea><br><br>
      <button id="chooseFolder" class="btn btn-outline-secondary internationalization" data-key="directoryButton.label">Choose Folder</button>
    </div>

    <div id="footer">
          <div th:replace="~{Layouts/footer}"></div>
    </div>

  </body>

</html>
