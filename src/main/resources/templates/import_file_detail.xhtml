<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:p="http://primefaces.org/ui"
    xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <link href="./Style/ReportGenStyles.css" rel="stylesheet" type="text/css" />
    <link rel="shortcut icon" th:href="@{Images/favico.ico}" />
    <link href="./Style/Headers.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>

    <div th:replace="~{Layouts/title}"></div>

</h:head>

<body>
    <f:view contentType="text/html">

        <!--++++++++++ HEADER 1 ++++++++-->
        <div id="header1">
            <div th:replace="~{Layouts/xbrl2_header1}"></div>
        </div>
        <!--++++++++++++++++++++++++++++-->

        <div id="mainContainer">
            <!--++++++++++ HEADER 2 ++++++++-->
            <div id="xml_header2">
                <div th:replace="~{Layouts/xbrl2_header2}"></div>
            </div>
            <!--++++++++++++++++++++++++++++-->

            <table style="width: 100%">
                <tr>
                    <td style="width: 70%; padding: 0;">
                        <ul style="margin:0; padding: 0px 0px 0px 0px; list-style: none;">
                            <li class="menu_item" style="float: left;font-size:12px;"><a th:href="@{/import_file}" target="_self" style="display: block; padding: 10px">Executar Importacao</a></li>
                            <li class="menu_item" style="float: left;font-size:12px;"><a th:href="@{/importFileDetail}" target="_self" style="display: block; padding: 10px;background-color:#D9D9D9;">Relatórios</a></li>
                            <li class="menu_item" style="float: left;font-size:12px;"><a th:href="@{/import_file}" target="_self" style="display: block; padding: 10px;">Resumo</a></li>
                            <li class="menu_item" style="float: left;font-size:12px;"><a th:href="@{/import_file}" target="_self" style="display: block; padding: 10px;">Regras</a></li>
                        </ul>
                    </td>
                </tr> 
            </table>            


            <table style="width: 100%">
                <tr>
                    <td style="width: 70%; padding: 0;">
                        <ul style="margin:0; padding: 0px 0px 0px 0px; list-style: none;">
                            <li class="menu_item" style="float: left;font-size:10px;"><a href="import_file_detail.xhtml" target="_self" style="display: block; padding: 10px; background-color:#D9D9D9;">Detalhes Importacao</a></li>
                            <li class="menu_item" style="float: left;font-size:10px;"><a href="imported_file_maps_list.xhtml" target="_self" style="display: block; padding: 10px; ">Mapas Importados</a></li>
                            <li class="menu_item" style="float: left;font-size:10px;"><a href="imported_file_cells_list.xhtml" target="_self" style="display: block; padding: 10px;">DataPoints Importados</a></li>
                            <li class="menu_item" style="float: left;font-size:10px;"><a href="imported_files_export.xhtml" target="_self" style="display: block; padding: 10px;">Exportar Relatórios</a></li>
                        </ul>
                    </td>
                </tr> 
            </table>

            <div class="Sep"> </div>
            <br/>
            <div id="dvPageTitle">Módulo Importacao</div>
            <br />
            <strong>Aqui pode consultar os logs associados a cada relatório importado.</strong>
            <br >
            </br >
            <div class="Sep"> </div>
            <br/>
            <div> 
                <div class="SepRed"> 
                    <div><h:outputText value="Logs de importacao" style="font-weight:bold; font-size: 14px; color: white; vertical-align: middle; padding-left: 5px;"/></div>
                </div>
                <div id="dvLogs">
                    <h:panelGrid columns="1" border="0" style="border:1px solid #CFCFCF;"> 
                        <p:growl id="msgs" showDetail="true" />
                        <h:form id="myForm2" prependId="false">
                            <p:panel style="border: none; padding: 0;">
                                <h:outputLabel for="year" value=" Data de referência: "/>
                                <h:selectOneMenu  id="year" value="#{importFileDetailBean.year}" style="width:150px">
                                    <f:selectItem itemLabel="Ano"  noSelectionOption="true"/>
                                    <f:selectItems value="#{importFileDetailBean.getYears()}"/>
                                    <p:ajax event="change" update="month module entity domain" listener="#{importFileDetailBean.setMonth(null)}"/>
                                </h:selectOneMenu>
                                &nbsp;
                                <h:selectOneMenu  id="month" value="#{importFileDetailBean.month}" style="width:150px" disabled="#{empty importFileDetailBean.year}">
                                    <f:selectItem itemLabel="Mês" noSelectionOption="true" />
                                    <f:selectItems value="#{importFileDetailBean.getMonths()}" var="monthGeneration" itemLabel="#{monthGeneration[0]}" itemValue="#{monthGeneration[1]}"/>
                                    <p:ajax event="change" update="module entity domain" listener="#{importFileDetailBean.setModuleVersion(null)}"/>
                                </h:selectOneMenu>
                                &nbsp;
                                <h:outputLabel value="Módulo: " />
                                <h:selectOneMenu  id="module" value="#{importFileDetailBean.moduleVersion}" style="width:160px" converter="moduleVersion" disabled="#{empty importFileDetailBean.month or empty importFileDetailBean.year}">
                                    <f:selectItem itemLabel="Módulo" noSelectionOption="true"/>
                                    <f:selectItems value="#{importFileDetailBean.getModulesByDate(importFileDetailBean.year, importFileDetailBean.month, refData.generateID, false)}" var="moduleVersionGeneration" itemLabel="#{moduleVersionGeneration.code}" itemValue="#{moduleVersion}"/>
                                    <p:ajax event="change" update="entity domain" />
                                </h:selectOneMenu>
                                &nbsp;
                                <h:outputLabel for="entity" value="Entidade: "/>
                                <h:selectOneMenu  id="entity" value="#{importFileDetailBean.entity}" converter="entities" disabled="#{empty importFileDetailBean.moduleVersion}">
                                    <f:selectItem itemLabel="Entidade" itemValue="" noSelectionOption="true"/>
                                    <f:selectItems value="#{importFileDetailBean.getEntities()}" var="confEntities" itemLabel="#{importFileDetailBean.paddEntity(confEntities.bdpId)} - #{confEntities.description}" itemValue="#{confEntities}"/>
                                    <p:ajax event="change" update="domain" listener="#{importFileDetailBean.setDomain(null)}"/>
                                </h:selectOneMenu>
                                &nbsp;
                                <h:outputLabel for="domain" value="Domínio: "/>
                                <h:selectOneMenu  id="domain" value="#{importFileDetailBean.domain}" style="margin-right:10px;" disabled="#{empty importFileDetailBean.entity}">
                                    <f:selectItem itemLabel="Domínio" itemValue="" noSelectionOption="true"/>
                                    <f:selectItems value="#{importFileDetailBean.getDomains()}"/>
                                </h:selectOneMenu>
                                &nbsp;
                                <p:commandButton id="refresh" value="Pesquisar" action="#{importFileDetailBean.getImportDetails(refData.importID, true)}" update="myForm2 msgs" ajax="true" style="margin-left:-10px;margin-bottom: 8px; font-size:10px" styleClass="btnRefresh" />
                                <p:ajaxStatus style="display:inline-block;margin-left: 5px;height:24px;">
                                    <f:facet name="default">
                                        <h:outputText value="" />
                                    </f:facet>
                                    <f:facet name="start">
                                        <div >
                                            <h:graphicImage value="/images/ajaxloader.gif" />
                                        </div>
                                    </f:facet>
                                    <f:facet name="complete">
                                        <h:outputText value="" />
                                    </f:facet>
                                </p:ajaxStatus>
                                <div style="float:right;">                                      

                                <h:commandLink>
                                    <h:graphicImage value="../images/csvicon.jpg" />
                                    <h:outputText  value="Download" style="font-size:10px"/>
                                    <p:dataExporter type="xlsxstream" target="myTable1"  fileName="ImportDetails" />
                                </h:commandLink>
                                </div>
                            </p:panel>
                            <p:panel style="border: none; padding: 0;">
                                <p:dataTable var="impDetails" value="#{importFileDetailBean.impDetails}" id="myTable1" paginator="true" rows="25" paginatorAlwaysVisible="false" emptyMessage="Sem registos encontrados!">
                                    <p:column headerText="Módulo" style="text-align: center; width: 5%">
                                        <h:outputText value="#{impDetails.code}"/>
                                    </p:column>
                                    <p:column headerText="Entidade" style="text-align: center; width: 10%">
                                        <h:outputText value="#{impDetails.entity}"/>
                                    </p:column>
                                    <p:column headerText="Domínio" style="text-align: center; width: 3%">
                                        <h:outputText value="#{impDetails.domain}"/>
                                    </p:column>
                                    <p:column headerText="Data referência" style="text-align: center; width: 5%">
                                        <h:outputText value="#{impDetails.referenceDate}" />
                                    </p:column>
                                    <p:column headerText="Descricao" style="text-align: center;">
                                        <h:outputText value="#{impDetails.description}" />
                                    </p:column>
                                    <p:column headerText="Data" style="text-align: center; width: 10%">
                                        <h:outputText value="#{impDetails.timestamp}"/>
                                    </p:column>
                                </p:dataTable>
                            </p:panel>
                        </h:form>
                    </h:panelGrid>
                    <br /><br /> <br />
                </div>
            </div>
        </div>


        <!--++++++++++++ FOOTER +++++++++++-->
        <div id="footer">
            <div th:replace="~{Layouts/footer}"></div>
        </div>
        <!--++++++++++++++++++++++++++++-->

    </f:view>

</body>

</html>
