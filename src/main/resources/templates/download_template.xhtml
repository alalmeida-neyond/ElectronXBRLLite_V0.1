
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      >
    <h:head>
        
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <link href="./Style/ReportGenStyles.css" rel="stylesheet" type="text/css"/>
        <link rel="shortcut icon" th:href="@{Images/favico.ico}" />
        <link href="./Style/Headers.css" rel="stylesheet" type="text/css"/>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
        <div th:replace="~{Layouts/title}"></div>



    </h:head>
    <body>
        <f:view contentType="text/html">
            <!--++++++++++ HEADER 1 ++++++++-->
            <div id="header1">
                <div th:replace="~{Layouts/xbrl2_header1}"></div>
            </div>
            <!--++++++++++++++++++++++++++++-->

            
            <div id="mainContainer">

                <!--++++++++++ HEADER 2 ++++++++-->
                <div id="header1">
                    <div th:replace="~{Layouts/xbrl2_header2}"></div>
                </div>
                <!--++++++++++++++++++++++++++++-->
                
                <div class="Sep"> </div>
                <br /><br />
                
                <div id="dvPageTitle">Templates</div>
               <br/>
  
                <div>
                    <strong >Nesta seccao é possível fazer download de templates para o preenchimento de relatórios.</strong>

                    <br/><br/><br/>
                    <div class="Sep" style="width:100%"> </div>
                    <br/>
                    <div class="SepRed" style="width:100%"> 
                        <div><h:outputText value="Templates disponíveis para download" style="font-weight:bold; font-size: 14px; color: white; vertical-align: middle; padding-left: 5px;"/></div>
                    </div>
                    
                    <h:panelGrid columns="1" border="0" style="border: 1px solid #CFCFCF;width:100%">
                    <br/>
                    
                    </h:panelGrid>
                        <br /><br /><br />


                        <table border="1">
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Description</th>
                            </tr>
                            <tr th:each="template : ${templates}">
                                <td th:text="${template.id}"></td>
                                <td th:text="${template.name}"></td>
                                <td th:text="${template.description}"></td>
                            </tr>
                        </table>

                </div>


            </div>
            <!--++++++++++++ FOOTER +++++++++++-->
            <div id="footer">
                <ui:insert name="footer" >
                    <ui:include src="../Layouts/footer.xhtml"/>
                </ui:insert>
            </div>
            <!--++++++++++++++++++++++++++++-->

        </f:view>
    </body>
</html>
