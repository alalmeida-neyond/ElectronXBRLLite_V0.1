<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org/">

<head>
  <div th:replace="~{Layouts/title}"></div>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="./Style/mainPageUpload.css" rel="stylesheet" type="text/css" />
  <link rel="shortcut icon" th:href="@{/Images/favico.ico}" />
  <link href="./Style/Headers.css" rel="stylesheet" type="text/css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="./Scripts/licensingPage.js"></script>
</head>

<body>
  <div id="header1">
    <div th:replace="~{Layouts/xbrl2_header1}"></div>
  </div>

  <br>
  <br>
  <div class="container">
    <div th:if="${expired}" class="alert alert-warning internationalization" data-key="licenseExpiredMessage.label">
      Your license has expired.
      <form th:action="@{/renewLicense}" method="post">
          <button type="submit" class="btn btn-warning internationalization" data-key="licenseExpiredButton.label">Renew License</button>
      </form>
    </div>
  </div>
  <div class="container" id="licensing">
    <br><br>

    <form id="licensingForm" method="post" th:action="@{/licensing}" enctype="multipart/form-data">
      <div class="form-group mb-2">
        <label for="licensingString" class="internationalization" data-key="licenseLabel.label">Licensing Key</label>
        <textarea class="form-control internationalization" name="licensingString" id="licensingString"
          data-key="licensePlaceholder.label" aria-describedby="licensingStringHelp"
          placeholder="Enter Licensing Key"></textarea>
      </div>
      <small id="licensingStringHelp" class="form-text text-muted internationalization p-2"
        data-key="licenseHelp.label">NEVER SHARE THIS KEY WITH ANYONE</small>
      <input type="submit" class="btn btn-primary mb-2 internationalization confirmLicenseButton" data-key="confirmLicense.label" />
    </form>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
  </div>

  <div id="footer">
    <div th:replace="~{Layouts/footer}"></div>
  </div>
  

</body>

</html>
