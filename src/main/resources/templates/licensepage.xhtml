<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org/">

<head>
  <div th:replace="~{Layouts/title}"></div>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="./Style/mainPageUpload.css" rel="stylesheet" type="text/css" />
  <link rel="shortcut icon" th:href="@{/Images/favico.ico}" />
  <link href="./Style/Headers.css" rel="stylesheet" type="text/css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="./Scripts/licensingPage.js"></script>
</head>

<body>
  <div id="header1">
    <div th:replace="~{Layouts/xbrl2_header1}"></div>
  </div>

  <br>
  <br>
  <div class="container">
    <div class="form-check form-check-inline">
      <input class="form-check-input" type="radio" name="inlineRadioOptions" id="registration" value="register" onclick = "selectionForms()" checked>
      <label class="form-check-label internationalization" data-key="requestForLicense.label" for="registration">Request
        For License</label>
    </div>
    <div class="form-check form-check-inline">
      <input class="form-check-input" type="radio" name="inlineRadioOptions" id="validation" value="validate" onclick = "selectionForms()">
      <label class="form-check-label internationalization" data-key="insertLicense.label" for="validation">Insert
        License</label>
    </div>
  </div>
  <div class="container" id="requestLicense">
    <form id="requestForm" method="post" th:action="@{/requestLicense}" enctype="multipart/form-data">
      <div class="form-group mb-2 ">
        <label for="inputEmail" >Email</label>
        <input type="email" name="inputEmailText" class="form-control" id="inputEmail">
      </div>
      <div class="form-group mb-2 ">
        <label for="inputLEICODE" >LEI Code</label>
        <input type="text" name="inputLEICODEText" class="form-control" id="inputLEICODE" minlength="20" maxlength="20" placeholder="xxxxxxxxxxxxxxxxxxxx">
      </div>
      <div class="form-group mb-2 ">
        <label for="inputHardwareID" class="internationalization" data-key="uuid.label">Universally Unique Identifier</label>
        <input type="text" name="inputHardwareIDText" class="form-control" id="inputHardwareID" minlength="36" maxlength="36" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
      </div>
      <div class="form-group mb-4 ">
        <label for="inputBDPID" >BDPID</label>
        <input type="text" name="inputBDPIDText" class="form-control" id="inputBDPID" pattern="[0-9]{4}" required placeholder="0000">
      </div>

      <div class="form-group mb-4 ">
        <label for="inputLicenseType" class="internationalization" data-key="typeLicense.label">Type Of License</label>
        <select id="inputLicenseType" class="form-control" name="licenseTypeDropdown">
          <option selected value="" class="internationalization" data-key="optionDefault.label">Choose...</option>
          <option value="trial" class="internationalization" data-key="optionTrial.label">Trial</option>
          <option value="month" class="internationalization" data-key="optionMontly.label">Monthly</option>
          <option value="year" class="internationalization" data-key="optionAnnual.label">Annual</option>
        </select>
      </div>
      <input type="submit" class="btn btn-primary mb-2 internationalization" data-key="sendLicense.label" />
    </form>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
  </div>

  <div class="container" id="licensing" style="display: none;">
    <br><br>

    <form id="licensingForm" method="post" th:action="@{/licensing}" enctype="multipart/form-data">
      <div class="form-group mb-2">
        <label for="licensingString" class="internationalization" data-key="licenseLabel.label">Licensing Key</label>
        <textarea class="form-control internationalization" name="licensingString" id="licensingString"
          data-key="licensePlaceholder.label" aria-describedby="licensingStringHelp"
          placeholder="Enter Licensing Key"></textarea>
      </div>
      <small id="licensingStringHelp" class="form-text text-muted internationalization p-2"
        data-key="licenseHelp.label">NEVER SHARE THIS KEY WITH ANYONE</small>
      <input type="submit" class="btn btn-primary mb-2 internationalization" data-key="confirmLicense.label" />
    </form>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
  </div>

  <div id="footer">
    <div th:replace="~{Layouts/footer}"></div>
  </div>
  

</body>

</html>
