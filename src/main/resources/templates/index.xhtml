<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:p="http://primefaces.org/ui"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
>
  <h:head>
    <meta
      http-equiv="Content-Type"
      content="application/xhtml+xml; charset=UTF-8"
    />
    <link href="./Style/ReportGenStyles.css" rel="stylesheet" type="text/css" />
    <link rel="shortcut icon" type="image/ico" th:href="@{Images/favico.ico}"/>
    <link href="./Style/Headers.css" rel="stylesheet" type="text/css" />
    <div th:replace="~{Layouts/title}"></div>
  </h:head>
  <h:body>
    <f:view contentType="application/xhtml+xml">
      <!--++++++++++ HEADER 1 ++++++++-->
      <div id="header1">
        <div th:replace="~{Layouts/header1}"></div>
      </div>
      <!--++++++++++++++++++++++++++++-->
      <br />
      <div id="mainContainer">
        <div class="Sep"></div>
        <br />

        <div id="dvPageTitle">Bem-vindo(a)</div>

        <h:messages style="color: blue" showDetail="true" />

        <div style="height: 400px">
          <br />
          <strong
            >&nbsp;&nbsp;A aplicacao disponibiliza dois processos: <br /><br />
            &nbsp;&nbsp;&nbsp;&nbsp; - Validacao de relatórios Corep e Finrep de
            acordo com o Validation Formulae, e geracao dos relatórios em
            formato XBRL para submissão ao Banco de Portugal;
            <br /><br /> &nbsp;&nbsp;&nbsp;&nbsp; - Validacao dos Controlos de
            Consistência de Nível II Locais;</strong
          >
          <br /><br />
        </div>
      </div>

      <script
        type="text/javascript"
        src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js"
      ></script>
      <script
        type="text/javascript"
        src="http://arrow.scrolltotop.com/arrow88.js"
      ></script>

      <!--++++++++++++ FOOTER +++++++++++-->
      <div id="footer">
        <div th:replace="~{Layouts/footer}"></div>
      </div>
      <!--++++++++++++++++++++++++++++-->
    </f:view>
  </h:body>
</html>
