    <div id="dvFooterContainer" style="width: 100%; position: static">
        <table style="width: 100%;">

                <td style="width: 50%; text-align: left; padding-left:10px;">© Neyond
                        . Todos os direitos reservados.</td>
                        <td style="width: 50%; text-align: right; padding-right:10px;">
                            <form id="metadataForm" enctype="multipart/form-data" onsubmit="downloadMetadata(event)">
                                <span>
                                    <input type="submit" onclick="downloadMetadata(event)" value="Atualizar Metadados" id="uploadButtonMetadata" style="margin: 0 5px; width: auto"/>
                                </span>
                            </form>
                        </td>

                        por Neyond</a> <div>XBRL Lite 1.0</div></td>
            </tr>
        </table>
    </div>

    <script>
        function downloadMetadata(event) {
            event.preventDefault();

            var formData = new FormData(document.getElementById("metadataForm"));

            let uploadButton = document.getElementById("uploadButtonMetadata");
            uploadButton.disabled = true;
            uploadButton.value = "A Atualizar...";

            fetch("/processMetaData", {
                method: "POST"
            }).then(response => response.json())
                .then(data => {
                    alert(data.message); // Show API response

                    if (data.enabled) {
                        uploadButton.disabled = false;
                        uploadButton.value = "Atualizar Metadados";
                    }})
                    .catch(error => {
                        console.error("Error:", error);
                    })
                    .finally(() => {
                        alert('Para concluir a atualizacao dos metadados, por favor, feche a aplicacao e volte a abrir!')
                        uploadButton.disabled = false;
                        uploadButton.value = "Atualizar Metadados";
                    });

        
        }
        function checkFooterPosition(){
            let footer = document.getElementById("footer");
            let body = document.body;
            let html = document.documentElement;
            
            let documentHeigth = Math.max(body.scrollHeight,body.offsetHeight, html.clientHeight,html.scrollHeight,html.offsetHeight);
            let windowHeigth = window.innerHeight;
            if(documentHeigth & lt != windowHeigth){
                footer.style.bottom = '0';
            }else{
                footer.style.bottom = '';
            }
        }
        checkFooterPosition();
        window.addEventListener('resize',checkFooterPosition);
        window.addEventListener('scroll',checkFooterPosition);
    </script>
