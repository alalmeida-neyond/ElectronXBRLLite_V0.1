<!DOCTYPE html>
<html>

<h:head>
  <link href="./Style/Headers.css" rel="stylesheet" type="text/css" />
  <style>
    #dvPageHeader {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 20px;
  background-color: #033d51; /* or your preferred dark color */
  color: white;
}

#dvlogo img {
  width: 150px;
  height: auto;
}

#dvheaderGroup {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  color: white;
}

#dvheaderRight {
  font-weight: bold;
  margin-bottom: 10px;
  color: white;
}

#dvheaderRightDown {
  display: flex;
  gap: 16px;
  padding: 10px 0;
}

#dvheaderRightDown a {
  color: white;
  font-weight: 600;
  text-decoration: none;
}

#dvheaderRightDown a:hover {
  text-decoration: underline;
}

  #languageSwitcher {
    background-color: transparent;
    color: white;
    border: none;
    font-weight: 600;
    text-decoration: underline;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
  }
  #languageSwitcher option {
    color: black; /* makes dropdown readable */
  }


  </style>
</h:head>

<body>
  <div id="dvPageHeader">
    <div id="dvlogo">
      <a th:href="@{/}" title="Homepage"><img th:src="@{/Images/logo-branco.png}"
          style="height: auto; width: 45%" /></a>
    </div>
    <div id="dvheaderGroup">
      <div id="dvheaderRight" class="internationalization" data-key="toBeInserted.label" th:attr="data-value=${LEICode}">
      </div>

      <div id="dvheaderRightDown">
        <a th:href="@{/}" class="internationalization" data-key="templates.label" title="Templates">{{templates.label}}</a>
        <a th:href="@{/}" class="internationalization" data-key="manual.label" title="Manual">{{manual.label}}</a>
        <a th:href="@{/settings}" class="internationalization" data-key="settings.label" title="Settings">{{settings.label}}</a>
        <div class="language-switcher">
          <select id="languageSelect" class="form-select form-select-sm w-auto">
            <option value="pt" selected>Português</option>
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
            <option value="it" >Italiano</option>
            <option value="de">Deutsch</option>
          </select>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
