<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:p="http://primefaces.org/ui"
  xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
  <link href="./Style/Headers.css" rel="stylesheet" type="text/css" />
  <style>
    #dvPageHeader {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 20px;
  background-color: #033d51; /* or your preferred dark color */
  color: white;
}

#dvlogo img {
  width: 150px;
  height: auto;
}

#dvheaderGroup {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  color: white;
}

#dvheaderRight {
  font-weight: bold;
  margin-bottom: 10px;
  color: white;
}

#dvheaderRightDown {
  display: flex;
  gap: 16px;
  padding: 10px 0;
}

#dvheaderRightDown a {
  color: white;
  font-weight: 600;
  text-decoration: none;
}

#dvheaderRightDown a:hover {
  text-decoration: underline;
}

  </style>
</h:head>

<body>
  <div id="dvPageHeader">
    <div id="dvlogo">
      <a th:href="@{/}" title="Homepage"><img th:src="@{/Images/logo-branco.png}"
          style="height: auto; width: 45%" /></a>
    </div>
    <div id="dvheaderGroup">
      <div id="dvheaderRight">
        LEI CODE: *A INSERIR*
      </div>

      <div id="dvheaderRightDown">
        <a th:href="@{/}" title="Templates">Templates de Utilização</a>
        <a th:href="@{/}" title="Manual">Manual de Utilizador</a>
        <a th:href="@{/}" title="Settings">Configurações</a>
        <a th:href="@{/}" title="Language">Idioma</a>
      </div>
    </div>
  </div>
</body>

</html>
