<!DOCTYPE html>
<html>

<h:head>
  <link href="./Style/Headers.css" rel="stylesheet" type="text/css" />
</h:head>

<body>
  <div id="dvPageHeader">
    <div id="dvlogo">
      <a th:href="@{/}" title="Homepage" id="homepage"><img th:src="@{/Images/logo-branco.png}"
          style="height: auto; width: 45%" /></a>
    </div>
    <div id="dvheaderGroup">
      <!--<div id="dvheaderRight" class="internationalization" data-key="toBeInserted.label" th:attr="data-value=${LEICode}">-->
      </div>

      <div id="dvheaderRightDown">
        <a th:href="@{/templates}" class="internationalization" data-key="templates.label" title="Templates" id="templatesPage">{{templates.label}}</a>
        <a th:href="@{/manual}" class="internationalization" data-key="manual.label" id="manualPage" title="Manual">{{manual.label}}</a>
        <div class="language-switcher">
          <select id="languageSelect" class="form-select form-select-sm w-auto">
            <option value="pt" selected>Português</option>
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
            <option value="it" >Italiano</option>
            <option value="de">Deutsch</option>
          </select>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
