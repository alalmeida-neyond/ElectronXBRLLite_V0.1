
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      >
    <body>
        <ui:composition> 
            <div class="nav">
                <div clas="overflow">
                    <table style="width: 100%">
                        <tr>
                            <td style="width: 70%; padding: 0;">
                                <ul style="margin:0; padding: 0px 0px 0px 0px; list-style: none;">
                                    <li class="menu_item #{refDataBean.canSelectButton(view.viewId, 'xbrl2_header2', 'Templates') ? 'menu_itemOn' : 'menu_item'}" style="float: left;"><a th:href="@{/download_template}" target="_self" style="display: block; padding: 10px;">Templates</a></li>
                                    <c:choose>
                                        <c:when test="#{profiles_headerxbrlbean.importBoolean}">
                                            <li class="menu_item nav_separator #{refDataBean.canSelectButton(view.viewId, 'xbrl2_header2', 'Importacao') ? 'menu_itemOn' : 'menu_item'}" style="float: left;"><a th:href="@{/import_file}" target="_self" style="display: block; padding: 10px;">Importacao</a></li>
                                        </c:when>
                                    </c:choose>
                                    <c:choose>
                                        <c:when test="#{profiles_headerxbrlbean.validate}">
                                            <li class="menu_item nav_separator #{refDataBean.canSelectButton(view.viewId, 'xbrl2_header2', 'Validacao') ? 'menu_itemOn' : 'menu_item'}" style="float: left;"><a th:href="@{/run_validations}" target="_self" style="display: block; padding: 10px;">Validacoes</a></li>
                                        </c:when>
                                    </c:choose>
                                    <c:choose>
                                        <c:when test="#{profiles_headerxbrlbean.generate}">
                                            <li class="menu_item nav_separator #{refDataBean.canSelectButton(view.viewId, 'xbrl2_header2', 'Geracao') ? 'menu_itemOn' : 'menu_item'}" style="float: left;"><a th:href="@{/generate_xbrl}" target="_self" style="display: block; padding: 10px;">Geracao XBRL</a></li>
                                        </c:when>
                                    </c:choose>                                        
                                </ul>
                            </td>
                        </tr>
                    </table>
                </div>
            </div>
        </ui:composition>
    </body>
</html>
