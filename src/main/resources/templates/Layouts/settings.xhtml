<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:p="http://primefaces.org/ui"
    xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="./Style/ReportGenStyles.css" rel="stylesheet" type="text/css" />
    <link href="./Style/mainPageUpload.css" rel="stylesheet" type="text/css" />
    <link rel="shortcut icon" th:href="@{/Images/favico.ico}" />
    <link href="./Style/Headers.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
    <div th:replace="~{Layouts/title}"></div>

    <script lang="javascript">
        var m = new Date();
        //document.writeln("date: " + m);
    </script>
</h:head>

<body>
    <f:view contentType="text/html">

        <!--++++++++++ HEADER 1 ++++++++-->
        <div id="header1">
            <div th:replace="~{Layouts/xbrl2_header1}"></div>
        </div>
        <!--++++++++++++++++++++++++++++-->
        <div id="mainContainer">

            <div class="Sep"> </div>
            <br />

            <div id="dvPageTitle">Definições</div>
            <br />

            <div class="settingsDiv">
                <form id="rulesForm" method="post" th:action="@{/importFile/select-rules}"
                    enctype="multipart/form-data">
                    <div class="dropdown">
                        <div class="dropdown-content" id="rules-dropdown">
                        </div>
                    </div>
                </form>

                <button type="submit" class="saveSettings">Guardar Configurações</button>
            </div>

            <div class="downloadMetadataDiv">
                <form id="metadataForm" enctype="multipart/form-data" onsubmit="downloadMetadata(event)">
                    <span>
                        <input type="submit" onclick="downloadMetadata(event)" value="Atualizar Metadados"
                            id="uploadButtonMetadata" style="margin: 0 5px; width: auto" />
                    </span>
                </form>
            </div>

        </div>




        <!--++++++++++++ FOOTER +++++++++++-->
        <div id="footer">
            <div th:replace="~{Layouts/footer}"></div>
        </div>
        <!--++++++++++++++++++++++++++++-->

    </f:view>

</body>
<script type="text/javascript">
    document.addEventListener("DOMContentLoaded", function () {
        const uploadArea = document.getElementById("upload-area");
        const excelFileInput = document.getElementById("file");

        uploadArea.addEventListener("click", () => excelFileInput.click());

        excelFileInput.addEventListener("change", () => {
            if (excelFileInput.files.length > 0) {
                uploadFile(excelFileInput.files[0]);
            }
        });

        uploadArea.addEventListener("dragover", (e) => {
            e.preventDefault();
            uploadArea.classList.add("dragover");
        });

        uploadArea.addEventListener("dragleave", () => {
            uploadArea.classList.remove("dragover");
        });

        uploadArea.addEventListener("drop", (e) => {
            e.preventDefault();
            uploadArea.classList.remove("dragover");
            const file = e.dataTransfer.files[0];
            if (file) {
                uploadFile(file);
            }
        });

        function validateFile(input) {
            var file = input.files[0];
            if (file) {
                var fileName = file.name.toLowerCase();
                if (!fileName.endsWith(".xlsx") && !fileName.endsWith(".xls")) {
                    alert("Tipo de ficheiro inválido. Por favor carrega um ficheiro Excel (.xls ou .xlsx).");
                    input.value = "";
                }
            }
        }

        function downloadMetadata(event) {
            event.preventDefault();

            var formData = new FormData(document.getElementById("metadataForm"));

            let uploadButton = document.getElementById("uploadButtonMetadata");
            uploadButton.disabled = true;
            uploadButton.value = "A Atualizar...";

            fetch("/processMetaData", {
                method: "POST"
            }).then(response => response.json())
                .then(data => {
                    alert(data.message); // Show API response

                    if (data.enabled) {
                        uploadButton.disabled = false;
                        uploadButton.value = "Atualizar Metadados";
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                })
                .finally(() => {
                    alert('Para concluir a atualizacao dos metadados, por favor, feche a aplicacao e volte a abrir!')
                    uploadButton.disabled = false;
                    uploadButton.value = "Atualizar Metadados";
                });


        }

        function uploadFile(file) {
            const formData = new FormData();
            formData.append("file", file);

            fetch("/importFile/upload", {
                method: "POST",
                body: formData
            })
                .then(response => response.text())
                .then(data => {
                    document.getElementById("result").innerHTML = data;
                    document.getElementById("logContainer").style.display = "block";
                })
                .catch(error => console.error("Error:", error));
        }

        async function loadImportRules() {
            try {
                const res = await fetch('/api/rules');
                const rules = await res.json();

                console.log("Fetched rules:", rules);

                const container = document.getElementById('rules-dropdown');
                container.innerHTML = '';

                rules.forEach(rule => {
                    const input = document.createElement('input');
                    input.type = 'checkbox';
                    input.value = rule.importRuleID;
                    input.checked = rule.alwaysRun;
                    input.disabled = rule.alwaysRun;

                    const label = document.createElement('label');
                    label.style.display = "block";
                    label.appendChild(input);
                    label.appendChild(document.createTextNode(' ' + rule.ruleName));
                    container.appendChild(label);
                });
            } catch (err) {
                console.error("Failed to load rules:", err);
            }
        }

        loadImportRules();
    });
</script>

</html>
